name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: twin
          POSTGRES_PASSWORD: twin
          POSTGRES_DB: twin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twin -d twin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://twin:twin@localhost:5432/twin_test
      TEST_DATABASE_URL: postgresql+psycopg://twin:twin@localhost:5432/twin_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      # Tests never call OpenAI or download models (also enforced in tests/conftest.py)
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"  # ML libs (SciPy, XGBoost, SHAP) need >= 3.12
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    # The plan's Playwright happy path, against the real app (backend with the fake LLM).
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: twin
          POSTGRES_PASSWORD: twin
          POSTGRES_DB: twin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twin -d twin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://twin:twin@localhost:5432/twin
      JWT_SECRET: ci-e2e-only-secret-not-used-anywhere-else
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
      SCHEDULER_ENABLED: "false"
      DEMO_ENABLED: "true"
      CORS_ORIGINS: http://localhost:3000
      MODEL_STORE_DIR: /tmp/twin-models
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > ../frontend.log 2>&1 &
          npx playwright install --with-deps chromium
      - name: Wait for both servers
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          echo "servers did not start"; cat backend.log frontend.log; exit 1
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
            frontend.log
          retention-days: 7
