services:
  db:
    image: pgvector/pgvector:pg16
    container_name: twin-db
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      POSTGRES_DB: twin
    ports:
      - "5433:5432"
    volumes:
      - twin-pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  twin-pgdata:
